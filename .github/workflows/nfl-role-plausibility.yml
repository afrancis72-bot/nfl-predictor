name: NFL pregame player workload realism cross-check
on:
  pull_request:
    paths:
      - 'ai2_nfl_role_plausibility.py'
      - 'ai2_nfl_oneclick.py'
      - 'unified_app.py'
      - 'tests/test_nfl_role_plausibility.py'
      - 'tests/test_nfl_oneclick.py'
      - '.github/workflows/nfl-role-plausibility.yml'
  workflow_dispatch:
jobs:
  current-slate-observed-role:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NFL source dependencies
        run: python -m pip install numpy pandas scipy beautifulsoup4 streamlit
      - name: Compile NFL current-role and real unified app UI
        run: python -m compileall -q ai2_nfl_role_plausibility.py ai2_nfl_oneclick.py unified_app.py
      - name: Verify Puka/Adams and Bijan/Brian historical usage flags
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_nfl_role_plausibility.py' -v
      - name: One-click workflow and failclosed fantasy-score audit
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_nfl_oneclick.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_nfl_scoring_audit_failclosed.py' -v
      - name: Preserve weekly injury source protection
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_ai2_nfl_injury_context.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_ai2_nfl_priced_reserve_integration.py' -v
