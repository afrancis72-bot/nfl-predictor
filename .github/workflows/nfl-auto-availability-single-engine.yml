name: NFL automatic verified availability and single build mode
on:
  push:
    branches:
      - fix/nfl-auto-availability-transparent-fallback-20261118
    paths:
      - "unified_app.py"
      - "ai2_nfl_availability_auto.py"
      - "ai2_nfl_oneclick.py"
      - "tests/test_nfl_availability_auto_selection.py"
      - ".github/workflows/nfl-auto-availability-single-engine.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nfl-one-button-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unified NFL app dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy requests beautifulsoup4 pyarrow fsspec scikit-learn openpyxl streamlit
      - name: Compile production and new tests
        run: |
          python -m py_compile unified_app.py ai2_nfl_availability_auto.py ai2_nfl_oneclick.py tests/test_nfl_availability_auto_selection.py
      - name: Validate source gating, exact no-data scoring parity, model smoke and Bentley contract
        env:
          PYTHONPATH: .:tests
        run: |
          python -m unittest discover -s tests -p 'test_nfl_availability_auto_selection.py' -v
          python -m unittest discover -s tests -p 'test_nfl_unified_availability_integration.py' -v
          python -m unittest discover -s tests -p 'test_nfl_oneclick_smoke.py' -v
          python -m unittest discover -s tests -p 'test_nfl_oneclick.py' -v
          python -m unittest discover -s tests -p 'test_nfl_manual_review_drafts.py' -v
          python -m unittest discover -s tests -p 'test_nfl_bentley_release_gate.py' -v
      - name: Verify no duplicate user-facing choice, no certification, and no unverified player upgrade
        run: |
          python - <<'PY'
          from pathlib import Path
          from ai2_nfl_release_gate import nfl_classic_release_status
          a=Path("unified_app.py").read_text()
          assert 'nfl_engine_choice' not in a
          assert 'select_nfl_engine_from_sources(' in a
          assert 'nfl_draft_review_ack' not in a
          assert 'snapshot_draft, load_draft' in a
          assert not nfl_classic_release_status()["ready_for_entries"]
          print("Single automatic NFL build, source fallback visibly explained; certification unchanged.")
          PY
