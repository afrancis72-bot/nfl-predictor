name: NFL team passing prior controlled A/B research
on:
  push:
    branches:
      - research/nfl-team-pass-prior-ab-20261117
    paths:
      - 'dfs_stats_engine.py'
      - 'scripts/backtest_nfl_player_dk_means.py'
      - 'scripts/audit_nfl_team_pass_prior_ab.py'
      - 'tests/test_nfl_team_pass_prior_ab.py'
      - '.github/workflows/nfl-team-pass-prior-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-pregame-team-pass-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulator and historical data dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy beautifulsoup4 pyarrow fsspec
      - name: Confirm original defaults and football-stat conservation
        env:
          PYTHONPATH: .:tests
        run: |
          python -m py_compile dfs_stats_engine.py scripts/backtest_nfl_player_dk_means.py scripts/audit_nfl_team_pass_prior_ab.py
          python -m unittest discover -s tests -p 'test_nfl_team_pass_prior_ab.py' -v
          python -m unittest discover -s tests -p 'test_nfl_drive_pass_accounting.py' -v
          python -m unittest discover -s tests -p 'test_nfl_possession_engine.py' -v
          python -m unittest discover -s tests -p 'test_nfl_wr_volume_share.py' -v
          python -m unittest discover -s tests -p 'test_nfl_player_dk_means_holdout.py' -v
      - name: Compare same player-games using pregame-only 50/50 and team-only pass prior
        env:
          PYTHONPATH: .
        run: python -u scripts/audit_nfl_team_pass_prior_ab.py --n-sims 220 --out-dir nfl_team_pass_prior_ab
      - name: Archive game-by-game forecast and WR target diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-team-pass-prior-ab-research
          path: nfl_team_pass_prior_ab/
          if-no-files-found: warn
          retention-days: 30
      - name: Check paired results and lock release gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('nfl_team_pass_prior_ab/ab_validation.json'))
          assert r['production_approved'] is False
          assert r['one_click_modified'] is False
          assert r['independent_holdout'] is False
          assert r['candidate_selection_was_informed_by_inspected_history'] is True
          for name,study in r['windows'].items():
              assert study['matched_team_games']>=30
              assert study['matched_player_games']>=150
              assert study['matched_wr_games']>=40
              print(name, 'team attempts MAE',study['team_pass_attempts']['baseline_mae'],
                        '=>',study['team_pass_attempts']['candidate_mae'],
                    'DK MAE',study['player_partial_dk']['baseline_mae'],
                        '=>',study['player_partial_dk']['candidate_mae'])
          print('A/B diagnostics completed, NOT approved for production')
          PY
