name: NFL receiver yard reconciliation controlled A/B
on:
  push:
    branches:
      - research/nfl-receiver-yard-ab-20261117
    paths:
      - 'scripts/audit_nfl_receiver_yard_ab.py'
      - 'tests/test_nfl_receiver_yard_ab.py'
      - '.github/workflows/nfl-receiver-yard-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver-yard-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulator audit dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy beautifulsoup4 pyarrow fsspec
      - name: Verify opportunity conservation and original simulator regression
        env:
          PYTHONPATH: .:tests
        run: |
          python -m py_compile scripts/audit_nfl_receiver_yard_ab.py ai2_nfl_other_yard_reconcile.py
          python -m unittest discover -s tests -p 'test_nfl_receiver_yard_ab.py' -v
          python -m unittest discover -s tests -p 'test_nfl_team_pass_prior_ab.py' -v
          python -m unittest discover -s tests -p 'test_nfl_wr_volume_share.py' -v
          python -m unittest discover -s tests -p 'test_nfl_player_dk_means_holdout.py' -v
      - name: Full Sunday replay of unchanged original versus OTHER-first yard reconciliation
        env:
          PYTHONPATH: .
        run: python -u scripts/audit_nfl_receiver_yard_ab.py --n-sims 220 --out-dir nfl_receiver_yard_ab
      - name: Retain individual matched stat and player-game forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-receiver-yard-reconciliation-ab
          path: nfl_receiver_yard_ab/
          if-no-files-found: warn
          retention-days: 30
      - name: Gate research only — do not infer production success
        run: |
          python - <<'PY'
          import json
          r=json.load(open('nfl_receiver_yard_ab/validation.json'))
          assert r['production_approved'] is False
          assert r['one_click_modified'] is False
          assert r['independent_holdout'] is False
          assert r['baseline_strength']==0.0
          assert r['candidate_strength']==0.7
          for label,d in r['windows'].items():
              assert d['matched_player_games']>=150
              assert d['invariant_stats_all_exact']
              assert d['predicted_yards_changed']
              print(label,'player MAE',d['player']['baseline_mae'],'->',
                    d['player']['candidate_mae'],
                    'WR MAE',d['wr']['baseline_mae'],'->',d['wr']['candidate_mae'])
          print('Research analysis complete; no predictive release approval')
          PY
