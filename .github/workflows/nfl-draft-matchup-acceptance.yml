name: NFL draft matchup and Claude candidate acceptance
on:
  pull_request:
    branches: [feature/unified-ai2-platform]
  push:
    branches: [feature/nfl-draft-role-intelligence, feature/nfl-classic-no-opposing-dst]
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy pytest streamlit beautifulsoup4 requests
      - run: python -m compileall -q unified_app.py ai2_nfl_oneclick.py ai2_nfl_draft_matchup.py ai2_nfl_claude_candidates.py
      - run: python -m pytest -q tests/test_nfl_draft_matchup.py tests/test_nfl_role_defense_stat_engine.py tests/test_nfl_claude_candidates.py tests/test_ai2_nfl_lineup.py tests/test_ai2_nfl_correlation_guard.py tests/test_ai2_nfl_feasibility.py
