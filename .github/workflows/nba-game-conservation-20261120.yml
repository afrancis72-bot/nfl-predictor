name: NBA official availability and complete team-game score conservation
on:
  push:
    branches: [feature/unified-nba-game-conservation-injury-20261120]
    paths:
      - 'ai2_nba_workspace.py'
      - 'nba_engine/game_conservation.py'
      - 'nba_engine/data_sources.py'
      - 'nba_engine/injury_report.py'
      - 'nba_engine/live_game_smoke.py'
      - 'tests/test_nba_game_conservation.py'
      - 'requirements.txt'
      - '.github/workflows/nba-game-conservation-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-consistent-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile NBA sources and unified app
        run: |
          python -m py_compile ai2_nba_workspace.py nba_engine/data_sources.py nba_engine/game_conservation.py nba_engine/injury_report.py nba_engine/live_game_smoke.py
      - name: Synthetic team-minute/scoring/injury regression
        env:
          PYTHONPATH: .:tests
        run: python -m unittest discover -s tests -p 'test_nba_game_conservation.py' -v
      - name: Protect legacy NBA prop and odds interfaces
        env:
          PYTHONPATH: .:tests
        run: |
          python -m unittest discover -s tests -p 'test_ai2_nba_integration.py' -v
          python -m unittest discover -s tests -p 'test_ai2_nba_odds.py' -v
      - name: Real 11-20 official NBA injury PDF and team-game smoke
        env:
          PYTHONPATH: .:tests
        run: python -m nba_engine.live_game_smoke
      - name: Verify no main app or other sport regressions from this isolated change
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path('ai2_nba_workspace.py').read_text()
          assert 'fetch_current_official_injuries(' in ui
          assert 'simulate_conserved_nba_games(' in ui
          assert 'normalize_team_minutes(' in ui
          assert 'selected_seed' in ui
          assert 'market_total_used_to_fit' in Path('nba_engine/game_conservation.py').read_text()
          assert 'Hard Rock' not in Path('nba_engine/game_conservation.py').read_text()
          print('NBA only: injury data first; complete game points and minutes; market lines untouched.')
          PY
