name: NFL market lines real player-points holdout
on:
  pull_request:
    paths:
      - 'ai2_nfl_game_market.py'
      - 'dfs_stats_engine.py'
      - 'scripts/backtest_nfl_player_dk_means.py'
      - 'scripts/backtest_nfl_market_player_points.py'
      - '.github/workflows/nfl-market-player-p90.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  pregame-player-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install numpy pandas scipy beautifulsoup4
      - name: Compile and verify observed market-source football
        run: |
          python -m compileall -q scripts/backtest_nfl_market_player_points.py scripts/backtest_nfl_player_dk_means.py dfs_stats_engine.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_nfl_game_market.py' -v
      - name: 2025 train selected weight then untouched 2026 individual player DK/P90 validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          PYTHONPATH=. python -u scripts/backtest_nfl_market_player_points.py > /tmp/market_player.json 2>/tmp/market_player_err.log
          status=$?
          if [ "$status" -ne 0 ]; then
            cat /tmp/market_player_err.log
            if [ -n "$PR_NUMBER" ]; then
              { echo 'Player market total validation failed:'; echo '```'; tail -30 /tmp/market_player_err.log; echo '```'; } > /tmp/market_player_fail.md
              gh pr comment "$PR_NUMBER" --body-file /tmp/market_player_fail.md || true
            fi
            exit "$status"
          fi
          cat /tmp/market_player.json
          python - <<'PY' >/tmp/market_player_result.md
          import json
          d=json.load(open('/tmp/market_player.json'))
          print('**Historical team market totals: effect on ACTUAL fantasy player mean and P90**')
          print(f'Train on {d["train_period"]}, validate on {d["independent_holdout_period"]}. Chosen weight: {d["training_selected_weight"]}')
          for k,r in d['outcomes'].items():
              a,b=r['train'],r['holdout']
              print(f'- Market weight {k}: train mean MAE={a["sim_mean_mae"]}; holdout mean MAE={b["sim_mean_mae"]}, signed bias={b["sim_mean_signed_bias"]}, P90 coverage={b["simulated_p90_actual_coverage_pct"]}%, n={b["n"]}')
          print(f'Independent validation: mean improved={d["selected_holdout_mean_improved"]}, P90 nearer 90%={d["selected_holdout_p90_coverage_nearer_90"]}')
          print('This is experimental, not a proven cash-rate model. Market adjustment not enabled in production.')
          PY
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/market_player_result.md || true
          fi
