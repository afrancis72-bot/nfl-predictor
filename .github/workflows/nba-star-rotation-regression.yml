name: NBA league-wide rotation and usage guard regression
on:
  push:
    branches: [fix/nba-star-rotation-calibration-20261123]
    paths:
      - 'nba_engine/rotation_model.py'
      - 'nba_engine/game_conservation.py'
      - 'nba_engine/slate_runner.py'
      - 'nba_engine/rotation_diagnostic.py'
      - 'ai2_nba_workspace.py'
      - 'tests/test_nba_game_conservation.py'
      - '.github/workflows/nba-star-rotation-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pregame-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install -r requirements.txt
      - name: Compile unified app and NBA modules
        run: python -m compileall -q ai2_nba_workspace.py nba_engine tests
      - name: NBA rotation/score and sportsbook regressions
        env:
          PYTHONPATH: .:tests
        run: |
          python -m unittest discover -s tests -p 'test_nba_game_conservation.py' -v
          python -m unittest discover -s tests -p 'test_ai2_nba_integration.py' -v
          python -m unittest discover -s tests -p 'test_ai2_nba_odds.py' -v
      - name: Real November 23 all-game pregame NBA replay
        env:
          PYTHONPATH: .:tests
        run: python -m nba_engine.live_partial_report_smoke
      - name: Actual NBA star versus role regression across teams
        env:
          PYTHONPATH: .:tests
        run: python -m nba_engine.rotation_diagnostic
