name: Research football engine tests
on:
  push:
    branches: [dev/showdown-game-script-v1]
  workflow_dispatch:
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Compile research modules
        run: python -m py_compile snap_level_research.py historical_usage.py defensive_priors_research.py backtest_research.py historical_replay_research.py
      - name: Run research unit tests
        run: python -m unittest discover -s tests -p 'test_*research.py' -v
      - name: Run snap engine tests
        run: python -m unittest discover -s tests -p 'test_snap_engine_research.py' -v
