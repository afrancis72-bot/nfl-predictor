name: Research NBA official injury PDF text layout
on:
  push:
    branches: [feature/unified-nba-game-conservation-injury-20261120]
    paths: ['.github/workflows/nba-source-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pypdf pdfplumber
      - name: Show index links and actual 11-20 injury PDF structure
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          from io import BytesIO
          from pypdf import PdfReader
          h=requests.get('https://www.nba.com/players/injury-report',timeout=20)
          print('index',h.status_code,len(h.content),h.url)
          print('matches',re.findall(r'Injury-Report_2026-11-20_\d+_\d+(?:AM|PM)\.pdf',h.text)[-6:])
          u='https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-11-20_02_15PM.pdf'
          r=requests.get(u,timeout=20)
          print('pdf',r.status_code,len(r.content),r.headers.get('content-type'))
          p=PdfReader(BytesIO(r.content))
          print('pages',len(p.pages))
          for i in (0,1):
              print('---PLAIN PAGE',i,'---')
              txt=p.pages[i].extract_text() or ''
              print(txt[:5000])
              print('---LAYOUT PAGE',i,'---')
              try:
                  txt2=p.pages[i].extract_text(extraction_mode='layout') or ''
                  print(txt2[:4800])
              except Exception as exc: print('layout error',exc)
          PY
