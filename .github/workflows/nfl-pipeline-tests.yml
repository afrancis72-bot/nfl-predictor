name: NFL pipeline regression tests
on:
  push:
    branches:
      - feature/unified-ai2-platform
  workflow_dispatch:
jobs:
  nfl-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install numpy pandas scipy beautifulsoup4 requests streamlit openpyxl
      - name: Compile NFL modules and regression tests
        run: python -m compileall -q props_data.py ai2_nfl_auto_baselines.py ai2_nfl_matchups.py ai2_nfl_matchup_diagnostics.py ai2_nfl_injury_diagnostics.py ai2_nfl_dst_diagnostics.py ai2_nfl_inputs.py ai2_nfl_simulation_adapter.py ai2_nfl_candidate_builder.py ai2_nfl_sim_portfolio.py ai2_nfl_export.py unified_app.py test_ai2_nfl_auto_baselines.py test_ai2_nfl_matchup_diagnostics.py test_ai2_nfl_injury_diagnostics.py test_ai2_nfl_dst_diagnostics.py
      - name: Run focused NFL regression tests
        run: python -m unittest -v test_ai2_nfl_auto_baselines test_ai2_nfl_matchup_diagnostics test_ai2_nfl_injury_diagnostics test_ai2_nfl_dst_diagnostics
      - name: Validate complete NFL safety and integration suite
        run: python -m unittest discover -s tests -p 'test_ai2_*.py' -v
