name: Live unified NFL QB stack and candidate coverage
on:
  pull_request:
    paths:
      - 'ai2_nfl_qb_audit.py'
      - 'ai2_nfl_candidate_builder.py'
      - 'ai2_nfl_sim_portfolio.py'
      - 'ai2_nfl_oneclick.py'
      - 'unified_app.py'
      - 'tests/test_ai2_nfl_qb_stack_coverage.py'
      - '.github/workflows/nfl-qb-stack-validation.yml'
  push:
    branches: [feature/unified-ai2-platform]
    paths:
      - 'ai2_nfl_qb_audit.py'
      - 'ai2_nfl_candidate_builder.py'
      - 'ai2_nfl_sim_portfolio.py'
      - 'ai2_nfl_oneclick.py'
      - 'unified_app.py'
      - '.github/workflows/nfl-qb-stack-validation.yml'
  workflow_dispatch:
jobs:
  nfl-qb-stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app runtime
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q ai2_nfl_qb_audit.py ai2_nfl_candidate_builder.py ai2_nfl_sim_portfolio.py ai2_nfl_oneclick.py unified_app.py
      - name: Synthetic stack and candidate coverage tests
        run: python -m unittest discover -s tests -p test_ai2_nfl_qb_stack_coverage.py -v
      - name: Candidate builder existing tests
        run: python -m unittest discover -s tests -p test_ai2_nfl_candidate_builder.py -v
      - name: Simulated portfolio and exposure tests
        run: python -m unittest discover -s tests -p test_ai2_nfl_sim_portfolio.py -v
      - name: Full synthetic NFL Classic exposure and CSV integration
        run: python -m unittest discover -s tests -p test_ai2_nfl_portfolio_integration.py -v
      - name: One-click NFL orchestration tests
        run: python -m unittest discover -s tests -p test_nfl_oneclick.py -v
      - name: One-click synthetic full build regression
        run: python -m unittest discover -s tests -p test_nfl_oneclick_smoke.py -v
