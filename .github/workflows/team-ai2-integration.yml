name: Team AI2 NFL integration checks
on:
  push:
    branches: [dev/showdown-game-script-v1]
  pull_request:
    paths:
      - "showdown_dk_export.py"
      - "pages/9_Snap_Research_Lab.py"
      - "tests/**"
jobs:
  showdown-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python -m unittest discover -s tests -p 'test_showdown_dk_export.py' -v
      - run: python -m compileall -q showdown_dk_export.py pages/9_Snap_Research_Lab.py pages/10_Main_Slate_Simulator.py pages/0_Team_AI2_NFL_Command_Center.py
