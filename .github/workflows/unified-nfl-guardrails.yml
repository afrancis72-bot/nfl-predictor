name: Unified NFL guardrail checks
on:
  push:
    branches:
      - feature/unified-ai2-platform
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - run: python -m compileall -q ai2_nfl_eligibility.py ai2_nfl_candidate_builder.py ai2_nfl_sim_portfolio.py unified_app.py
      - run: python -m unittest discover -s tests -p 'test_nfl_guardrail_smoke.py' -v
