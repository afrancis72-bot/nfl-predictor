name: Live unified NFL QB stack and portfolio checks
on:
  pull_request:
    paths:
      - 'ai2_nfl_candidate_builder.py'
      - 'ai2_nfl_sim_portfolio.py'
      - 'ai2_nfl_qb_audit.py'
      - 'ai2_nfl_oneclick.py'
      - 'ai2_nfl_correlation_guard.py'
      - 'ai2_nfl_portfolio_audit.py'
      - 'ai2_nfl_portfolio_risk.py'
      - 'ai2_nfl_role_intelligence.py'
      - 'ai2_nfl_stack_intelligence.py'
      - 'tests/test_ai2_nfl_role_intelligence.py'
      - 'tests/test_ai2_nfl_stack_intelligence.py'
      - 'ai2_nfl_model_pool.py'
      - 'ai2_nfl_input_integrity.py'
      - 'tests/test_ai2_nfl_portfolio_risk.py'
      - 'ai2_build_identity.py'
      - 'unified_app.py'
      - 'tests/test_ai2_nfl_correlation_guard.py'
      - 'tests/test_ai2_nfl_portfolio_audit.py'
      - 'tests/test_ai2_nfl_qb_stack_regression.py'
      - '.github/workflows/live-nfl-qb-stacks.yml'
  push:
    branches: [feature/unified-ai2-platform]
    paths:
      - 'ai2_nfl_candidate_builder.py'
      - 'ai2_nfl_sim_portfolio.py'
      - 'ai2_nfl_qb_audit.py'
      - 'ai2_nfl_oneclick.py'
      - 'ai2_nfl_correlation_guard.py'
      - 'ai2_nfl_portfolio_audit.py'
      - 'ai2_nfl_portfolio_risk.py'
      - 'ai2_nfl_role_intelligence.py'
      - 'ai2_nfl_stack_intelligence.py'
      - 'tests/test_ai2_nfl_role_intelligence.py'
      - 'tests/test_ai2_nfl_stack_intelligence.py'
      - 'ai2_nfl_model_pool.py'
      - 'ai2_nfl_input_integrity.py'
      - 'tests/test_ai2_nfl_portfolio_risk.py'
      - 'ai2_build_identity.py'
      - 'unified_app.py'
      - 'tests/test_ai2_nfl_correlation_guard.py'
      - 'tests/test_ai2_nfl_portfolio_audit.py'
      - 'tests/test_ai2_nfl_qb_stack_regression.py'
      - '.github/workflows/live-nfl-qb-stacks.yml'
  workflow_dispatch:
jobs:
  nfl-qb-stack-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile actual unified NFL production modules
        run: python -m compileall -q unified_app.py ai2_build_identity.py ai2_nfl_portfolio_audit.py ai2_nfl_portfolio_risk.py ai2_nfl_role_intelligence.py ai2_nfl_stack_intelligence.py ai2_nfl_model_pool.py ai2_nfl_input_integrity.py ai2_nfl_correlation_guard.py ai2_nfl_candidate_builder.py ai2_nfl_sim_portfolio.py ai2_nfl_qb_audit.py ai2_nfl_oneclick.py
      - name: Test exact QB candidate and stacking regressions
        run: python -m unittest discover -s tests -p test_ai2_nfl_qb_stack_regression.py -v
      - name: Test live DST correlation guard, downloadable audit and build identity
        run: python -m unittest discover -s tests -p test_ai2_nfl_correlation_guard.py -v && python -m unittest discover -s tests -p test_ai2_nfl_portfolio_audit.py -v
      - name: Test limited-role RB exposure and maximum lineup overlap
        run: python -m unittest discover -s tests -p test_ai2_nfl_portfolio_risk.py -v
      - name: Test observed returning RB competition and same-world QB stack lift
        run: python -m unittest discover -s tests -p test_ai2_nfl_role_intelligence.py -v && python -m unittest discover -s tests -p test_ai2_nfl_stack_intelligence.py -v
      - name: Test existing candidate and simulated portfolio safety
        run: python -m unittest discover -s tests -p test_ai2_nfl_candidate_builder.py -v && python -m unittest discover -s tests -p test_ai2_nfl_sim_portfolio.py -v
