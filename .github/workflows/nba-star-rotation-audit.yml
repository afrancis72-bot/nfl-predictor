name: NBA star rotation audit on real source logs
on:
  push:
    branches: [fix/nba-star-rotation-calibration-20261123]
    paths:
      - 'nba_engine/rotation_diagnostic.py'
      - 'nba_engine/game_conservation.py'
      - 'nba_engine/predictor.py'
      - '.github/workflows/nba-star-rotation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-nba-rotation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m nba_engine.rotation_diagnostic
