name: NFL opponent-conditioned football simulator experimental holdout
on:
  push:
    branches:
      - feature/unified-ai2-platform
    paths:
      - 'ai2_nfl_sim_component_factors.py'
      - 'dfs_stats_engine.py'
      - 'scripts/backtest_nfl_player_dk_means.py'
      - 'scripts/backtest_nfl_matchup_simulator.py'
      - 'tests/test_nfl_matchup_component_simulator.py'
      - 'tests/test_nfl_matchup_simulator_backtest.py'
      - '.github/workflows/nfl-matchup-simulator-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opponent-conditioned-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install football model dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy beautifulsoup4
      - name: Verify strict matchup provenance and per-game stat conservation
        run: |
          python -m py_compile ai2_nfl_sim_component_factors.py dfs_stats_engine.py scripts/backtest_nfl_matchup_simulator.py
          PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_nfl_matchup_component_simulator.py' -v
          PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_nfl_matchup_simulator_backtest.py' -v
          PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_nfl_defensive_efficiency_scoring.py' -v
      - name: Chronological A/B test against actual player scores; all Sunday games
        env:
          PYTHONPATH: .
        run: |
          python -u scripts/backtest_nfl_matchup_simulator.py \
            --n-sims 400 --out-dir nfl_matchup_simulator_audit
      - name: Archive all data even when model does not pass research requirements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-opponent-aware-A-B
          path: nfl_matchup_simulator_audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Reject underperforming defense effects without modifying production
        run: |
          python - <<'PY'
          import json,sys
          d=json.load(open('nfl_matchup_simulator_audit/test_results.json'))
          print('Selected only from 2025:', d['selected_strength_from_2025_only'])
          for test,passed in d['requirements'].items():
              print(('PASS ' if passed else 'FAIL ')+test)
          print('Always production approved:', d['production_approved'])
          if not d['research_component_pass']:
              print('Research test failed; existing one-click scoring remains unchanged.')
              sys.exit(1)
          print('Research-only test passed; prospective/out-of-time validation is still mandatory.')
          PY
