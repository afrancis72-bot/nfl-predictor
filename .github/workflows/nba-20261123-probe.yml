name: Probe 2026-11-23 NBA official status completeness
on:
  push:
    branches: [fix/nba-unsubmitted-game-skip-per-matchup-20261123]
    paths: [.github/workflows/nba-20261123-probe.yml]
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pypdf requests
      - run: |
          python - <<'PY'
          from io import BytesIO
          from pypdf import PdfReader
          import requests,re
          url='https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-11-23_02_45PM.pdf'
          r=requests.get(url,timeout=20); print('URL',r.status_code,len(r.content));r.raise_for_status()
          reader=PdfReader(BytesIO(r.content));print('PAGES',len(reader.pages))
          for i,page in enumerate(reader.pages):
              lines=list(reversed((page.extract_text(extraction_mode='layout') or '').splitlines()))
              print('PAGE',i+1)
              for j,line in enumerate(lines):
                  if any(term in line for term in ('NOT YET SUBMITTED','NOTHING TO REPORT','@','Not Yet Submitted','Not yet submitted')):
                      print('ROW',j,repr(line[:230]))
          PY
