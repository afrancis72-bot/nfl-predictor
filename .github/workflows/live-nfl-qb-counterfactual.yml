name: Live NFL counterfactual QB and held-out projection checks
on:
  pull_request:
    paths:
      - 'ai2_nfl_qb_conditional.py'
      - 'ai2_nfl_qb_counterfactual.py'
      - 'ai2_nfl_projection_accountability.py'
      - 'ai2_nfl_candidate_builder.py'
      - 'ai2_nfl_sim_portfolio.py'
      - 'ai2_nfl_qb_audit.py'
      - 'ai2_nfl_oneclick.py'
      - 'unified_app.py'
      - 'tests/test_ai2_nfl_counterfactual_holdout.py'
      - '.github/workflows/live-nfl-qb-counterfactual.yml'
  push:
    branches: [feature/unified-ai2-platform]
    paths:
      - 'ai2_nfl_qb_conditional.py'
      - 'ai2_nfl_qb_counterfactual.py'
      - 'ai2_nfl_projection_accountability.py'
      - 'ai2_nfl_candidate_builder.py'
      - 'ai2_nfl_sim_portfolio.py'
      - 'ai2_nfl_qb_audit.py'
      - 'ai2_nfl_oneclick.py'
      - 'unified_app.py'
      - 'tests/test_ai2_nfl_counterfactual_holdout.py'
      - '.github/workflows/live-nfl-qb-counterfactual.yml'
  workflow_dispatch:
jobs:
  nfl-qb-accountability:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Syntax check actual unified NFL code
        run: python -m compileall -q ai2_nfl_qb_conditional.py ai2_nfl_qb_counterfactual.py ai2_nfl_projection_accountability.py ai2_nfl_oneclick.py ai2_nfl_candidate_builder.py ai2_nfl_sim_portfolio.py ai2_nfl_qb_audit.py unified_app.py
      - name: QB conditional stack, holdout and source-risk regression
        run: python -m unittest discover -s tests -p test_ai2_nfl_counterfactual_holdout.py -v
      - name: Existing QB coverage and opportunity checks
        run: python -m unittest discover -s tests -p test_ai2_nfl_qb_stack_coverage.py -v && python -m unittest discover -s tests -p test_ai2_nfl_qb_stack_regression.py -v
      - name: Existing candidate and simulated lineup controls
        run: python -m unittest discover -s tests -p test_ai2_nfl_candidate_builder.py -v && python -m unittest discover -s tests -p test_ai2_nfl_sim_portfolio.py -v
