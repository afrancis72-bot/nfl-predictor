name: NFL mandatory component-scoring audit before DraftKings export
on:
  pull_request:
    paths:
      - 'ai2_nfl_player_audit.py'
      - 'ai2_nfl_projection_review.py'
      - 'ai2_nfl_oneclick.py'
      - 'tests/test_nfl_oneclick.py'
      - 'tests/test_nfl_scoring_audit_failclosed.py'
      - '.github/workflows/nfl-scoring-audit-failclosed.yml'
  workflow_dispatch:
jobs:
  reject-unverified-stat-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NFL observed-stat dependencies
        run: python -m pip install numpy pandas scipy beautifulsoup4 streamlit
      - name: Compile actual one-click path and unified four-sport UI
        run: python -m compileall -q ai2_nfl_player_audit.py ai2_nfl_projection_review.py ai2_nfl_oneclick.py unified_app.py
      - name: Refuse to export unaudited or inconsistent NFL points
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_nfl_scoring_audit_failclosed.py' -v
      - name: Preserve complete NFL one-click portfolio and expected evidence
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_nfl_oneclick.py' -v
      - name: Preserve existing Puka/Bijan high-mean review flags
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_ai2_nfl_projection_review.py' -v
      - name: Verify prior live stat-source and injury integrity
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_ai2_nfl_injury_context.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_ai2_nfl_priced_reserve_integration.py' -v
