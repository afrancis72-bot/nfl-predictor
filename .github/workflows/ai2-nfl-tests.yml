name: AI2 NFL safety tests

on:
  push:
    branches:
      - feature/unified-ai2-platform
    paths:
      - 'ai2_nfl_*.py'
      - 'tests/test_ai2_*.py'
      - 'dfs_stats_engine.py'
      - 'props_data.py'
      - 'unified_app.py'
      - 'injury_opportunity.py'
      - 'tests/test_ai2_independent_scoring.py'
      - 'tests/test_ai2_nfl*.py'
      - 'tests/test_ai2_public_nfl_history.py'
      - 'tests/test_ai2_dk_scoring_audit.py'
      - 'ai2_market_*.py'
      - 'tests/test_ai2_market*.py'
      - '.github/workflows/ai2-nfl-tests.yml'
  workflow_dispatch:

jobs:
  nfl-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NFL test dependencies
        run: python -m pip install numpy pandas scipy beautifulsoup4 requests streamlit openpyxl
      - name: Compile NFL engine and adapter tests
        run: python -m py_compile dfs_stats_engine.py injury_opportunity.py ai2_nfl_simulation_adapter.py tests/test_ai2_independent_scoring.py tests/test_ai2_nfl_simulation_adapter.py props_data.py ai2_nfl_availability.py tests/test_ai2_public_nfl_history.py tests/test_ai2_nfl_availability.py
      - name: Run isolated NFL safety tests
        run: python -m unittest discover -s tests -p 'test_ai2_*.py' -v
