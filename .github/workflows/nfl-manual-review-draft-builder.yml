name: NFL manual-review draft builder regression
on:
  push:
    branches:
      - feature/nfl-manual-review-draft-builder-20261118
    paths:
      - "unified_app.py"
      - "ai2_nfl_oneclick.py"
      - "ai2_nfl_review.py"
      - "tests/test_nfl_manual_review_drafts.py"
      - "tests/test_nfl_bentley_release_gate.py"
      - ".github/workflows/nfl-manual-review-draft-builder.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unified-app Python dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy requests beautifulsoup4 pyarrow fsspec scikit-learn openpyxl streamlit
      - name: Compile unchanged Bentley lock and new draft workflow
        run: |
          python -m py_compile ai2_nfl_release_gate.py ai2_nfl_review.py ai2_nfl_oneclick.py unified_app.py tests/test_nfl_bentley_release_gate.py tests/test_nfl_manual_review_drafts.py
      - name: Verify user acknowledgements and separate saved draft portfolio
        env:
          PYTHONPATH: .:tests
        run: |
          python -m unittest discover -s tests -p 'test_nfl_manual_review_drafts.py' -v
          python -m unittest discover -s tests -p 'test_nfl_bentley_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_nfl_oneclick.py' -v
          python -m unittest discover -s tests -p 'test_nfl_oneclick_smoke.py' -v
      - name: Confirm draft preview does not turn Bentley certified
        run: |
          python - <<'PY'
          from pathlib import Path
          from ai2_nfl_release_gate import nfl_classic_release_status
          app=Path("unified_app.py").read_text()
          engine=Path("ai2_nfl_oneclick.py").read_text()
          status=nfl_classic_release_status()
          assert status["checks_passed"]==0 and not status["ready_for_entries"]
          assert 'disabled=not draft_acknowledged' in app
          assert '"BENTLEY_CERTIFIED" if release_ready' in app
          assert '"DRAFT_MANUAL_REVIEW_ONLY"' in app
          assert 'draft_manual_review=not release_ready' in app
          assert 'role_defense_strength = 0.0' in engine
          assert 'defense_weight = 0.0' in engine
          print("User drafts enabled only with acknowledgement; Bentley NOT certified.")
          PY
