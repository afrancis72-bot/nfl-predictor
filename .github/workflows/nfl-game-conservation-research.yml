name: NFL Bentley game-world conservation research
on:
  push:
    branches:
      - feature/unified-nfl-role-defense-ledger-20261118
    paths:
      - "dfs_stats_engine.py"
      - "ai2_nfl_game_conservation.py"
      - "tests/test_nfl_game_conservation.py"
      - ".github/workflows/nfl-game-conservation-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy requests beautifulsoup4 pyarrow fsspec scikit-learn
      - name: Compile model, independent audit, and test
        run: python -m py_compile dfs_stats_engine.py ai2_nfl_game_conservation.py tests/test_nfl_game_conservation.py
      - name: Deliberate target/carry/score corruption must fail closed
        env:
          PYTHONPATH: .:tests
        run: |
          python -m unittest discover -s tests -p 'test_nfl_game_conservation.py' -v
          python -m unittest discover -s tests -p 'test_ai2_nfl_team_pace_scoring.py' -v
          python -m unittest discover -s tests -p 'test_nfl_possession_engine.py' -v
      - name: Ten thousand correlated two-team worlds obey conservation
        env:
          PYTHONPATH: .:tests
        run: |
          python - <<'PY'
          import numpy as np
          from test_ai2_nfl_team_pace_scoring import sim_fixture
          from dfs_stats_engine import simulate_stat_driven_dfs
          from ai2_nfl_game_conservation import audit_team_game_conservation
          pool, rates = sim_fixture()
          players,scores,stat = simulate_stat_driven_dfs(
              pool,rates,n_sims=10000,seed=24687,allow_role_proxies=False)
          assert scores.shape==(10000,len(players))
          for team in ("AAA","BBB"):
              report=audit_team_game_conservation(stat,pool,team)
              assert report["worlds_verified"]==10000
              assert report["conserved_pass_attempt_slots"]
              assert not report["predictive_accuracy_validated"]
              print(team,report,flush=True)
          print("SOFTWARE CONSERVATION PASS. NOT NFL PREDICTIVE VALIDATION.",flush=True)
          PY
