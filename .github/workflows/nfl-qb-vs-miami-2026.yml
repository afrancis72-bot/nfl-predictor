name: 2026 Miami opposing QB actual versus pregame average
on:
  push:
    branches:
      - feature/unified-ai2-platform
    paths:
      - 'scripts/research_qbs_vs_miami_2026.py'
      - '.github/workflows/nfl-qb-vs-miami-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study-miami-qbs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Validate research script compiles
        run: python -m py_compile scripts/research_qbs_vs_miami_2026.py
      - name: "Compare QBs against 2026 Miami to their own pregame averages"
        run: PYTHONPATH=. python -u scripts/research_qbs_vs_miami_2026.py
